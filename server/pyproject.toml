[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifelog"
version = "0.1.0"
description = "The core server for the LifeLog system."
readme = "README.md"
requires-python = ">=3.11"
# Add your dependencies here if you want, but for now requirements.txt is fine.

[tool.setuptools.packages.find]
where = ["src"]