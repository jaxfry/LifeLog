[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    asyncio: mark test as async
    integration: mark test as integration test (requires PostgreSQL)
    unit: mark test as unit test
filterwarnings =
    ignore::DeprecationWarning

# =============================================================================
# DATABASE SAFETY CONFIGURATION
# =============================================================================
# By default, tests use an in-memory SQLite database to protect production data.
#
# For integration tests requiring PostgreSQL features (pgvector, etc.):
#   TEST_DATABASE_URL=postgresql+asyncpg://user:pass@localhost:5432/lifelog_test pytest
#
# NEVER set TEST_DATABASE_URL to your production database!
# =============================================================================
