services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lifelog
      POSTGRES_PASSWORD: lifelogpassword
      POSTGRES_DB: lifelog_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelog -d lifelog_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  server:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://lifelog:lifelogpassword@db:5432/lifelog_db
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      HACK_CLUB_AI_API_KEY: ${HACK_CLUB_AI_API_KEY}

  worker:
    build: .
    command: arq app.workers.main.WorkerSettings --watch /app
    volumes:
      - .:/app
      - ./storage:/app/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://lifelog:lifelogpassword@db:5432/lifelog_db
      REDIS_URL: redis://redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      HACK_CLUB_AI_API_KEY: ${HACK_CLUB_AI_API_KEY}

  migrate:
    build: .
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://lifelog:lifelogpassword@db:5432/lifelog_db

  web:
    build: ../web
    ports:
      - "5173:5173"
    volumes:
      - ../web:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1

  # Test database - completely isolated from production
  # Use this for integration tests that require PostgreSQL features
  test_db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lifelog_test
      POSTGRES_PASSWORD: lifelog_test_password
      POSTGRES_DB: lifelog_test_db
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    profiles:
      - testing  # Only starts when explicitly requested: docker compose --profile testing up test_db

volumes:
  postgres_data:
